title: Sua oficina com [controle real]{class="text-primary"}, do atendimento ao fechamento do mês
description: Chega de OS em papel, cliente sem histórico e financeiro no escuro. Atendimento, ordens de serviço, estoque, comissões e financeiro, tudo em um só sistema.
seo:
  title: AutoPro | Gestão completa para oficinas mecânicas
  description: AutoPro é o sistema que organiza ordens de serviço, clientes, veículos, estoque, compras, financeiro e emissão de notas fiscais — tudo em um lugar só. Feito para oficinas mecânicas no Brasil.
navigation: false
hero:
  headline: GESTÃO PARA OFICINAS MECÂNICAS
  links:
    - label: Começar agora
      icon: i-lucide-arrow-right
      trailing: true
      to: /signup
      size: xl
    - label: Ver como funciona
      icon: i-lucide-book-open
      size: xl
      color: neutral
      variant: subtle
      to: /docs/getting-started
sections:
  - headline: OPERAÇÃO
    title: Do orçamento aprovado à entrega do veículo, tudo organizado
    description: Cada OS registra o que foi feito, quanto foi cobrado, quais peças foram usadas e quem executou o serviço.
    id: features
    orientation: horizontal
    features:
      - name: Ordens de serviço do início ao fim
        description: Abra, acompanhe, feche e receba. Histórico completo de serviços, peças, impostos, pagamentos e comissões por funcionário.
        icon: i-lucide-clipboard-list
      - name: Histórico completo de clientes e veículos
        description: Na próxima visita, você já sabe o que foi feito e o que foi trocado. Sem perguntar de novo, sem procurar em outro lugar.
        icon: i-lucide-car-front
      - name: Agenda integrada ao atendimento
        description: Organize a entrada de veículos e converta agendamentos em OS com um clique. Sem planilha externa.
        icon: i-lucide-calendar-days
  - headline: FINANCEIRO
    title: Saiba quanto a oficina fatura, gasta e lucra a cada mês
    description: Compras, contas e lançamentos integrados à operação dão uma visão financeira real — não uma estimativa no fim do mês.
    orientation: horizontal
    reverse: true
    features:
      - name: Compras e fornecedores sob controle
        description: Registre pedidos, entradas e devoluções de peças, com estoque e financeiro atualizados automaticamente.
        icon: i-lucide-shopping-cart
      - name: Financeiro integrado à operação
        description: Contas a pagar e receber, extratos bancários, parcelamentos e comissões, tudo visível em um só lugar.
        icon: i-lucide-wallet
      - name: Relatórios para decidir com dados
        description: Faturamento, lucro, custos, inadimplência e desempenho por período, sem exportar nada e sem planilha manual.
        icon: i-lucide-bar-chart-3
features:
  headline: RECURSOS
  title: Tudo que a oficina precisa para parar de improvisar
  description: Operação, financeiro e gestão administrativa conectados em uma plataforma para o dia a dia de quem trabalha com veículos.
  items:
    - title: Tudo sobre o cliente na mesma tela
      description: Cliente, veículo e histórico de OS juntos, na mesma tela — sem procurar em três lugares diferentes.
      icon: i-lucide-users
    - title: OS que concentra a operação inteira
      description: Cada ordem registra serviços, peças, impostos, pagamentos e comissões — tudo visível para o mecânico e para o gestor.
      icon: i-lucide-wrench
    - title: Financeiro que faz sentido
      description: Compras, pagamentos, contas bancárias e parcelamentos conectados à operação real, sem planilha paralela.
      icon: i-lucide-banknote
    - title: Acesso certo para cada função
      description: Mecânico vê o que precisa para trabalhar, gestor enxerga tudo — sem dado exposto para quem não precisa.
      icon: i-lucide-shield-check
    - title: Operação e administração separadas
      description: O time da oficina opera em um contexto, o administrativo em outro — cada um vê só o que precisa.
      icon: i-lucide-split-square-vertical
    - title: Emissão de nota fiscal integrada
      description: NFS-e emitidas direto pelo sistema, com cancelamento, carta de correção e download de PDF.
      icon: i-lucide-file-stack
    - title: Controle de estoque com alertas
      description: Quantidade mínima configurável por peça, vinculada ao fornecedor — você sabe antes de faltar.
      icon: i-lucide-package-search
    - title: Comissões calculadas automaticamente
      description: Regras flexíveis por funcionário — percentual sobre faturamento ou lucro, por categoria de serviço, sem calcular na mão.
      icon: i-lucide-percent
howItWorks:
  headline: COMO FUNCIONA
  title: Comece a operar no mesmo dia
  description: Sem implantação longa e sem treinamento complicado — a oficina sai do papel e das planilhas em poucos passos.
  items:
    - title: Cadastre sua oficina
      description: Dados da empresa, número inicial de OS, conta bancária e regras de comissão, configurados em poucos minutos.
      icon: i-lucide-building-2
    - title: Adicione clientes e veículos
      description: Importe sua base ou cadastre conforme os atendimentos chegam. O histórico se constrói a partir da primeira OS.
      icon: i-lucide-users
    - title: Abra e acompanhe ordens de serviço
      description: Registre serviços, peças, impostos e pagamentos, com comissão por funcionário calculada automaticamente.
      icon: i-lucide-clipboard-list
    - title: Veja o financeiro em tempo real
      description: Faturamento, lucro e contas a pagar e receber sempre atualizados, sem montar planilha no fim do mês.
      icon: i-lucide-bar-chart-3
cta:
  title: Comece a organizar sua oficina hoje
  description: Veja o que muda quando operação, financeiro e atendimento funcionam juntos, em vez de espalhados em três lugares.
  links:
    - label: Criar conta grátis
      to: /signup
      trailingIcon: i-lucide-arrow-right
    - label: Ver documentação
      to: /docs/getting-started
      variant: subtle
      icon: i-lucide-book-open
