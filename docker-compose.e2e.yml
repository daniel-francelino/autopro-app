# Stack mínima do Supabase para testes de integração (tests/api) e E2E (Playwright).
# Sobe só o que o app usa: Postgres, Auth (GoTrue), REST (PostgREST), Storage e um gateway.
# Migrations aplicadas e chaves de teste fixas. Ephemeral: `down -v` apaga tudo.
#
#   pnpm stack:up      # sobe e espera ficar pronta
#   pnpm stack:down    # derruba e apaga os dados
#   pnpm test:stack    # sobe, roda api + e2e, derruba
#
# Portas (fora do range do `supabase start`, para os dois conviverem): gateway 54421, Postgres 54422.
# Mesmas versões de imagem do `supabase start` (supabase/config.toml), para o ambiente ser o mesmo.
name: autopro-e2e

x-env: &pg
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

services:
  db:
    image: public.ecr.aws/supabase/postgres:17.11.0.011
    container_name: autopro-e2e-db
    ports:
      - '127.0.0.1:${DB_PORT}:5432'
    environment:
      <<: *pg
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 5432
      POSTGRES_PORT: 5432
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: postgres
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: 3600
    volumes:
      - ./supabase/e2e/init-roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
    # Dados só em memória: a stack é descartável e fica bem mais rápida (principalmente no CI).
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres', '-h', 'localhost']
      interval: 3s
      timeout: 3s
      retries: 40

  auth:
    image: public.ecr.aws/supabase/gotrue:v2.197.0
    container_name: autopro-e2e-auth
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://127.0.0.1:${GATEWAY_PORT}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: http://localhost:3100
      GOTRUE_URI_ALLOW_LIST: http://localhost:3100/**
      GOTRUE_DISABLE_SIGNUP: 'false'
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: 'true'
      GOTRUE_MAILER_AUTOCONFIRM: 'true'
      GOTRUE_PASSWORD_MIN_LENGTH: 6
      GOTRUE_SMTP_HOST: 127.0.0.1
      GOTRUE_SMTP_PORT: 2500
      GOTRUE_SMTP_ADMIN_EMAIL: e2e@autopro.local
      GOTRUE_RATE_LIMIT_EMAIL_SENT: 1000
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:9999/health']
      interval: 3s
      timeout: 3s
      retries: 40

  storage:
    image: public.ecr.aws/supabase/storage-api:v1.88.0
    container_name: autopro-e2e-storage
    depends_on:
      db:
        condition: service_healthy
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      AUTH_JWT_SECRET: ${JWT_SECRET}
      PGRST_JWT_SECRET: ${JWT_SECRET}
      POSTGREST_URL: http://rest:3000
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: e2e
      REGION: local
      GLOBAL_S3_BUCKET: e2e
      ENABLE_IMAGE_TRANSFORMATION: 'false'
    tmpfs:
      - /var/lib/storage

  rest:
    image: public.ecr.aws/supabase/postgrest:v16.5
    container_name: autopro-e2e-rest
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: 'false'
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: 3600

  # Aplica as migrations de supabase/migrations (e supabase/e2e/seed/*.sql, se existir) e sai.
  migrate:
    image: public.ecr.aws/supabase/postgres:17.11.0.011
    container_name: autopro-e2e-migrate
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_healthy
      storage:
        condition: service_started
    restart: 'no'
    environment:
      <<: *pg
    volumes:
      - ./supabase/migrations:/migrations:ro
      - ./supabase/e2e:/e2e:ro
    # tr -d '\r' protege contra checkout com CRLF (Windows).
    entrypoint: ['bash', '-c', "tr -d '\\r' < /e2e/migrate.sh | bash"]

  # Porta única (como o Supabase hospedado). Só fica "saudável" depois que as migrations terminaram,
  # então `up --wait` só devolve o controle quando a stack está de fato pronta para uso.
  gateway:
    image: public.ecr.aws/supabase/kong:2.8.1
    container_name: autopro-e2e-gateway
    depends_on:
      migrate:
        condition: service_completed_successfully
      rest:
        condition: service_started
      auth:
        condition: service_healthy
    ports:
      - '127.0.0.1:${GATEWAY_PORT}:8000'
    environment:
      KONG_DATABASE: 'off'
      KONG_DECLARATIVE_CONFIG: /home/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 127.0.0.1:8001
    volumes:
      - ./supabase/e2e/kong.yml:/home/kong/kong.yml:ro
    healthcheck:
      test: ['CMD', 'kong', 'health']
      interval: 3s
      timeout: 5s
      retries: 30
