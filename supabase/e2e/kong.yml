# Gateway da stack de teste: uma porta só, como o Supabase hospedado (/auth/v1, /rest/v1, /storage/v1).
# Sem key-auth: PostgREST, GoTrue e Storage já validam o JWT que o supabase-js envia.
_format_version: '2.1'
_transform: true

services:
  - name: auth-v1
    url: http://auth:9999/
    routes:
      - name: auth-v1-all
        strip_path: true
        paths: [/auth/v1/]
  - name: rest-v1
    url: http://rest:3000/
    routes:
      - name: rest-v1-all
        strip_path: true
        paths: [/rest/v1/]
  - name: storage-v1
    url: http://storage:5000/
    routes:
      - name: storage-v1-all
        strip_path: true
        paths: [/storage/v1/]
