name: ci

on:
  push:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * *' # noturno (09:00 BRT): E2E completo

jobs:
  # L0 + L1 + L2 + L3-lite: sem Docker, segundos.
  static:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Tests (unit, static, handlers)
        run: pnpm run test

  # Os dois jobs abaixo sobem a MESMA stack local (docker-compose.e2e.yml: Postgres + Auth + REST + Storage +
  # gateway, com as 100+ migrations aplicadas e chaves de teste fixas) pelo mesmo runner de `pnpm test:stack`.

  # L3: testes contra Postgres real (tests/api). Todo push e PR; leva cerca de 2 min.
  api:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Stack + tests/api
        run: pnpm run test:stack --only=api

      - name: Logs da stack (falha)
        if: failure()
        run: docker compose -f docker-compose.e2e.yml --env-file supabase/e2e/stack.env logs --tail=200

  # L5: Playwright, fluxos de visitante e logados (contra a stack). PR para main e noturno.
  e2e:
    if: github.event_name == 'schedule' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Stack + Playwright
        run: pnpm run test:stack --only=e2e --project=desktop
        env:
          CI: 'true'

      - name: Logs da stack (falha)
        if: failure()
        run: docker compose -f docker-compose.e2e.yml --env-file supabase/e2e/stack.env logs --tail=200

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
