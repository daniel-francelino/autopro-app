name: ci

on:
  push:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * *' # noturno (09:00 BRT): E2E completo

jobs:
  # Projeto Vitest `fast` (tests/static + tests/fast): sem Docker, segundos.
  static:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Tests (fast: static, handlers, fluxos em memória)
        run: pnpm run test

  # Os dois jobs abaixo sobem a MESMA stack local (docker-compose.e2e.yml: Postgres + Auth + REST + Storage +
  # gateway, com as 100+ migrations aplicadas e chaves de teste fixas) pelo mesmo runner de `pnpm test:stack`.

  # Projeto Vitest `db`: testes contra Postgres real (tests/db). Todo push e PR; leva cerca de 2 min.
  api:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Stack + tests/db
        run: pnpm run test:stack --only=db

      - name: Logs da stack (falha)
        if: failure()
        run: docker compose -f docker-compose.e2e.yml --env-file supabase/e2e/stack.env logs --tail=200

  # L5: Playwright, fluxos de visitante e logados (contra a stack). PR para main e noturno.
  e2e:
    if: github.event_name == 'schedule' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      # Chromium do Playwright: cache pela versão de @playwright/test. Com cache, só as dependências do sistema.
      - name: Playwright version
        id: pw
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Chromium system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # Build (.output): cache pelo carimbo do código + config + lockfile + variáveis de build (scripts/test-stack.mjs).
      # O runner confere .output/build-stamp.json e só builda se não bater; chave incompleta = falso verde, por isso o hash cobre tudo.
      - name: Build key
        id: build-key
        run: echo "key=$(node scripts/test-stack.mjs --print-build-key)" >> "$GITHUB_OUTPUT"

      - name: Cache build (.output)
        uses: actions/cache@v4
        with:
          path: .output
          key: nuxt-output-${{ runner.os }}-${{ steps.build-key.outputs.key }}

      - name: Stack + Playwright
        run: pnpm run test:stack --only=e2e --project=desktop
        env:
          CI: 'true'

      - name: Logs da stack (falha)
        if: failure()
        run: docker compose -f docker-compose.e2e.yml --env-file supabase/e2e/stack.env logs --tail=200

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            .test-output/playwright-report/
            .test-output/playwright/
